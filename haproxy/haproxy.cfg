global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    option  forwardfor
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    timeout tunnel  1h
    retries 3

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
    stats admin if TRUE
    stats auth admin:admin

frontend api_front
    bind *:80

    acl is_auth path_beg /auth
    acl is_msg  path_beg /messages

    use_backend auth_backends if is_auth
    use_backend message_backends if is_msg
    default_backend auth_backends

backend auth_backends
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    http-request replace-path /auth(/)?(.*) /\2
    server-template auth 4 auth-service:8000 check inter 5s fall 3 rise 2 resolvers docker init-addr last,libc,none

backend message_backends
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    http-request replace-path /messages(/)?(.*) /\2
    server-template msg 4 message-service:8000 check inter 5s fall 3 rise 2 resolvers docker init-addr last,libc,none

resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid 10s
